services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: 'no'
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?}
      NUXT_BETTER_AUTH_SECRET: ${NUXT_BETTER_AUTH_SECRET:?}
      NUXT_BETTER_AUTH_URL: ${NUXT_BETTER_AUTH_URL:?}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:?}
      NUXT_PUBLIC_COMPANY_NAME: ${NUXT_PUBLIC_COMPANY_NAME:-OC Networks Billing}
      NUXT_PUBLIC_BILLING_TIMEZONE: ${NUXT_BILLING_TIMEZONE:-Asia/Makassar}
      NUXT_PUBLIC_APP_REVISION: ${SOURCE_COMMIT:-}
      NUXT_COOLIFY_CREDENTIALS_KEY: ${NUXT_COOLIFY_CREDENTIALS_KEY:?}
      NUXT_METRICS_TOKEN: ${NUXT_METRICS_TOKEN:?}
      NUXT_BILLING_TIMEZONE: ${NUXT_BILLING_TIMEZONE:-Asia/Makassar}
      NUXT_BILLING_CURRENCY: ${NUXT_BILLING_CURRENCY:-IDR}
      NUXT_BILLING_AUTOMATION_ENABLED: ${NUXT_BILLING_AUTOMATION_ENABLED:-false}
      NUXT_BILLING_ACCESS_CONTROL_ENABLED: ${NUXT_BILLING_ACCESS_CONTROL_ENABLED:-false}
      NUXT_OVERDUE_GRACE_DAYS: ${NUXT_OVERDUE_GRACE_DAYS:-7}
      NUXT_GRACE_NOTICE_INTERVAL_HOURS: ${NUXT_GRACE_NOTICE_INTERVAL_HOURS:-24}
      NUXT_BILLING_GATE_SECRET: ${NUXT_BILLING_GATE_SECRET:?}
      NUXT_BILLING_GATE_SHARED_KEY: ${NUXT_BILLING_GATE_SHARED_KEY:?}
      NUXT_BILLING_GATE_INTERNAL_URL: ${NUXT_BILLING_GATE_INTERNAL_URL:?}
    ports:
      - '${APP_PORT:-8010}:3000'
    networks:
      - default
      - coolify
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  coolify:
    external: true
