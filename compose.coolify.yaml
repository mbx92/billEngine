services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - billengine_test_postgres_v3:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing -d billing']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: 'no'
    command:
      - sh
      - -c
      - npm run db:migrate:deploy && node scripts/seed-billing-gate-test.mjs
    environment:
      NUXT_DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD:?}@postgres:5432/billing
      BILLING_GATE_TEST_STATE: ${BILLING_GATE_TEST_STATE:-grace}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD:?}@postgres:5432/billing
      NUXT_BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      NUXT_BETTER_AUTH_URL: https://billengine.ocnetworks.web.id
      NUXT_PUBLIC_APP_URL: https://billengine.ocnetworks.web.id
      NUXT_PUBLIC_COMPANY_NAME: OC Networks Billing Test
      NUXT_PUBLIC_BILLING_TIMEZONE: Asia/Makassar
      NUXT_COMPANY_NAME: OC Networks Billing Test
      NUXT_BILLING_TIMEZONE: Asia/Makassar
      NUXT_BILLING_CURRENCY: IDR
      NUXT_BILLING_ACCESS_CONTROL_ENABLED: 'true'
      NUXT_OVERDUE_GRACE_DAYS: '7'
      NUXT_GRACE_NOTICE_INTERVAL_HOURS: '24'
      NUXT_BILLING_GATE_SECRET: ${BILLING_GATE_SECRET:?}
      NUXT_BILLING_GATE_SHARED_KEY: ${BILLING_GATE_SHARED_KEY:?}
    ports:
      - '${APP_PORT:-8010}:3000'
    networks:
      - default
      - coolify
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  billengine_test_postgres_v3:

networks:
  coolify:
    external: true
