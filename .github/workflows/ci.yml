name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: billengine_test
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billengine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://billing:billing@127.0.0.1:5432/billengine_test
      NUXT_DATABASE_URL: postgresql://billing:billing@127.0.0.1:5432/billengine_test
      NUXT_BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
      NUXT_BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
